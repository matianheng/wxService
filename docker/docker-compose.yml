version: '3'
services:
  litemall:
    build:
      context: litemall
      dockerfile: Dockerfile
    container_name: litemall
    ports:
      - "8080:8080"
    volumes:
      - ./litemall/storage:/storage
      - ./litemall/logs:/logs
      - ./litemall/backup:/backup
      - /etc/localtime:/etc/localtime
    environment:
      - TZ=Asia/Shanghai
      # 外部数据库连接配置
      - DB_HOST=47.97.87.227        # 外部数据库的 IP 地址
      - DB_PORT=3307                # 外部数据库的端口
      - DB_USERNAME=root_litemall   # 外部数据库的用户名
      - DB_PASSWORD=Longshine01    # 外部数据库的密码（请替换为实际密码）
      - DB_NAME=litemall            # 要连接的数据库名称
    restart: always
